dependencies:
  espressif/iot_eth:
    version: '*'
  # Local forks (patched) of the USB CDC/ECM drivers live in components/ and
  # override the registry versions. See components/iot_usbh_cdc and
  # components/iot_usbh_ecm (CHANGELOG.md documents every local patch).
  iot_usbh_ecm:
    override_path: ../components/iot_usbh_ecm
  espressif/iot_usbh_cdc:
    override_path: ../components/iot_usbh_cdc
version: 1.0.0

dependencies:
  espressif/esp_hosted:
    rules:
    - if: target in [esp32p4, esp32h2]
    version: ~2
  espressif/esp_wifi_remote:
    rules:
    - if: target in [esp32p4, esp32h2]
    version: '>=0.10,<2.0'
  # Uses IDF >=5.x APIs: httpd_req_get_cookie_val,
  # esp_netif_dhcps_get_clients_by_mac, IP_EVENT_ASSIGNED_IP_TO_CLIENT.
  # The ESP-CPE product baseline is ESP-IDF v6.1.
  idf: '>=6.1'
  cjson:
    version: '^1.7.19'
version: 1.0.1

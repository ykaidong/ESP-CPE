<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0">
    <title>ESP-CPE 管理后台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cpe.css">
    <link rel="icon" href="./img/favicon.ico">
</head>

<body>
<div class="home-base">
    <div class="header-base">
        <img class="header-logo" src="./img/logoBlack.png" alt="logo">
        <div class="header-menu" id="menuBtn"></div>
    </div>
    <div class="content-base flex">
        <div class="left-base" id="leftMenu">
            <ul>
                <li>
                    <a href="index.html">系统状态</a>
                </li>
                <li>
                    <a href="wlan.html" class="content">WLAN设置</a>
                </li>
            </ul>
        </div>
        <div class="right-base">
            <div class="page-header">
                <span class="header-title-one active-title" id="tab-basic">基本设置</span>
                <span>/</span>
                <span class="header-title-two" id="tab-advance">高级设置</span>
            </div>
            <div class="wlan-msg" id="wlan-msg"></div>
            <div class="page-content" id="baseShow">
                <div class="page-title">以下您可以对 WLAN 进行基本设置</div>
                <div class="page-detail">
                    <div class="line-base">
                        <span class="title">WLAN 名称:</span>
                        <input class="content" id="wlanName" maxlength="32" placeholder="请输入 WLAN 名称" autocomplete="off">
                    </div>
                    <div class="line-base">
                        <span class="title">安全模式:</span>
                        <select class="content" id="model" name="model" disabled>
                            <option value="WPA2_PSK" selected>WPA2-PSK（强制）</option>
                        </select>
                    </div>
                    <div class="line-base">
                        <span class="title">密码:</span>
                        <input class="content" id="password" type="password" maxlength="63" autocomplete="new-password" placeholder="留空表示不修改（8~63 位）">
                    </div>
                    <div class="line-base">
                        <span class="title">设备名称:</span>
                        <input class="content" id="deviceName" maxlength="32" placeholder="请输入设备名称（1~32 个字符）" autocomplete="off">
                    </div>
                    <div class="line-base flex flex-ac">
                        <span class="title">WLAN 隐身:</span>
                        <input class="content-two" type="checkbox" id="select" name="sel">
                        <span class="content-thr">WLAN 开启后，需要您必须在终端上输入正确的 WLAN 名称才能连接到 WLAN。</span>
                    </div>
                    <div class="line-base-btn">
                        <button class="save-btn" type="button" id="btn-save-basic">保存</button>
                    </div>
                </div>
            </div>
            <div class="page-content" id="highShow" hidden>
                <div class="page-title">您可以对 WLAN 设置以下两项个性化设置</div>
                <div class="page-detail">
                    <div class="line-base">
                        <span class="title">带宽:</span>
                        <select class="content" id="broadband" name="broadband">
                            <option value="20" selected>20MHz</option>
                            <option value="40">40MHz</option>
                        </select>
                    </div>
                    <div class="line-base">
                        <span class="title">信道:</span>
                        <select class="content" id="channel" name="channel">
                            <option value="1" selected>1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                            <option value="13">13</option>
                        </select>
                    </div>
                    <div class="line-base-btn">
                        <button class="save-btn" type="button" id="btn-save-advance">保存</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/api.js"></script>
<script src="js/wlan.js"></script>
</body>

</html>

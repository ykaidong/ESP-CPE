<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>设备登录 - ESP-CPE 管理后台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cpe.css">
    <link rel="icon" href="./img/favicon.ico">
</head>

<body>
<div class="home-base">
    <div class="header-base" id="app-header"></div>
    <div class="login-base">
        <div class="login-content">
            <img class="login-router-img" src="./img/celllink.svg" alt="CellLink">
            <div class="login-title">设备登录</div>
            <div class="login-subtitle">ESP-CPE 管理后台</div>
            <form id="login-form" autocomplete="on">
                <div class="flex flex-jcc">
                    <div class="password-base flex">
                        <input class="pwd-two" id="username" name="username" placeholder="请输入用户名" autocomplete="username" maxlength="32">
                    </div>
                </div>
                <div class="flex flex-jcc">
                    <div class="password-base flex">
                        <input class="pwd-two" id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" maxlength="63">
                    </div>
                </div>
                <div class="login-error" id="login-error"></div>
                <div class="login-btn flex flex-jcc">
                    <button class="save-btn" type="submit" id="btn-login">登录</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="js/layout.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>

</html>

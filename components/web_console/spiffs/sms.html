<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>短信 - ESP-CPE 管理后台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cpe.css">
    <link rel="icon" href="./img/favicon.ico">
</head>

<body>
<div class="home-base">
    <div class="header-base" id="app-header"></div>
    <div class="content-base flex">
        <div class="left-base" id="leftMenu"></div>
        <div class="right-base">
            <div class="page-header"></div>
            <div class="status-banner" id="sms-banner"></div>

            <div class="page-content">
                <div class="page-title">发送短信</div>
                <div class="sms-send-form">
                    <div class="sms-field">
                        <label class="sms-label" for="sms-number">接收号码</label>
                        <input class="sms-input" id="sms-number" type="tel" maxlength="21"
                               placeholder="可含 +，3~20 位数字" autocomplete="off">
                    </div>
                    <div class="sms-field">
                        <label class="sms-label" for="sms-text">短信内容</label>
                        <textarea class="sms-text" id="sms-text" maxlength="160" rows="4"
                                  placeholder="ASCII 最多 160（扩展符号按 2 个计），中文最多 70 字"></textarea>
                    </div>
                    <div class="sms-form-foot">
                        <span class="sms-count" id="sms-count">0 / 160</span>
                        <button class="save-btn sms-send-btn" type="button" id="sms-send-btn">发送短信</button>
                    </div>
                </div>

                <div class="page-title">短信记录</div>
                <div class="sms-storage" id="sms-storage"></div>
                <div class="sms-scroll">
                    <table class="sms-table">
                        <thead>
                        <tr>
                            <th class="sms-from">号码</th>
                            <th class="sms-body">内容</th>
                            <th class="sms-time">时间</th>
                            <th class="sms-op">操作</th>
                        </tr>
                        </thead>
                        <tbody id="sms-tbody"></tbody>
                    </table>
                </div>
                <div class="sms-empty" id="sms-empty"></div>

                <div class="page-title">短信转发（MQTT）</div>
                <div class="sms-mqtt-panel">
                    <div class="sms-mqtt-status">
                        <span class="sms-mqtt-status-label">连接状态</span>
                        <span class="sms-mqtt-state" id="mqtt-state">--</span>
                        <div class="sms-mqtt-note" id="mqtt-note"></div>
                    </div>

                    <fieldset class="sms-mqtt-group">
                        <legend class="sms-mqtt-legend">转发选项</legend>
                        <label class="sms-switch">
                            <input type="checkbox" id="mqtt-enabled">
                            <span class="sms-switch-track" aria-hidden="true"></span>
                            <span class="sms-switch-text">
                                <span class="sms-switch-label">启用转发</span>
                                <span class="sms-switch-hint">4G 在线时把收到的短信推送到 MQTT 服务器（仅 TLS）。</span>
                            </span>
                        </label>
                        <label class="sms-switch">
                            <input type="checkbox" id="mqtt-allow-send">
                            <span class="sms-switch-track" aria-hidden="true"></span>
                            <span class="sms-switch-text">
                                <span class="sms-switch-label">允许远程发送</span>
                                <span class="sms-switch-hint">执行下行主题中的发送命令，目标号码不受限制。</span>
                            </span>
                        </label>
                    </fieldset>

                    <fieldset class="sms-mqtt-group">
                        <legend class="sms-mqtt-legend">服务器</legend>
                        <div class="sms-mqtt-grid sms-mqtt-grid-host">
                            <label class="sms-field" for="mqtt-host">
                                <span class="sms-label">服务器地址</span>
                                <input class="sms-input" id="mqtt-host" maxlength="64"
                                       placeholder="mqtt.example.com 或 IPv4" autocomplete="off">
                            </label>
                            <label class="sms-field" for="mqtt-port">
                                <span class="sms-label">端口</span>
                                <input class="sms-input" id="mqtt-port" type="number" min="1"
                                       max="65535" value="8883" autocomplete="off">
                            </label>
                        </div>
                        <div class="sms-mqtt-grid">
                            <label class="sms-field" for="mqtt-user">
                                <span class="sms-label">用户名</span>
                                <input class="sms-input" id="mqtt-user" maxlength="64"
                                       placeholder="留空表示匿名登录" autocomplete="off">
                            </label>
                            <label class="sms-field" for="mqtt-pass">
                                <span class="sms-label">密码</span>
                                <input class="sms-input" id="mqtt-pass" type="password" maxlength="128"
                                       placeholder="留空表示不修改" autocomplete="new-password">
                            </label>
                        </div>
                    </fieldset>

                    <fieldset class="sms-mqtt-group">
                        <legend class="sms-mqtt-legend">主题</legend>
                        <div class="sms-mqtt-grid">
                            <label class="sms-field" for="mqtt-topic-up">
                                <span class="sms-label">上行主题（设备 → 服务器）</span>
                                <input class="sms-input" id="mqtt-topic-up" maxlength="128"
                                       placeholder="例如 cpe/sms/up" autocomplete="off">
                            </label>
                            <label class="sms-field" for="mqtt-topic-down">
                                <span class="sms-label">下行主题（服务器 → 设备）</span>
                                <input class="sms-input" id="mqtt-topic-down" maxlength="128"
                                       placeholder="例如 cpe/sms/down" autocomplete="off">
                            </label>
                        </div>
                    </fieldset>

                    <fieldset class="sms-mqtt-group">
                        <legend class="sms-mqtt-legend">服务器证书</legend>
                        <p class="sms-mqtt-ca-state" id="mqtt-ca-state"></p>
                        <div class="sms-mqtt-ca-row">
                            <input class="sms-file" id="mqtt-ca-file" type="file"
                                   accept=".pem,.crt,.cer,text/plain">
                            <button class="sms-btn-plain" type="button" id="mqtt-ca-upload">上传证书</button>
                            <button class="sms-btn-plain" type="button" id="mqtt-ca-clear">清除证书</button>
                        </div>
                    </fieldset>

                    <div class="sms-mqtt-actions">
                        <button class="save-btn" type="button" id="mqtt-save">保存转发设置</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/layout.js"></script>
<script src="js/api.js"></script>
<script src="js/sms.js"></script>
<script src="js/sms_mqtt.js"></script>
</body>
</html>

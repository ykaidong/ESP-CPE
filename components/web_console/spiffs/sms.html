<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>短信 - ESP-CPE 管理后台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cpe.css">
    <link rel="icon" href="./img/favicon.ico">
</head>

<body>
<div class="home-base">
    <div class="header-base" id="app-header"></div>
    <div class="content-base flex">
        <div class="left-base" id="leftMenu"></div>
        <div class="right-base">
            <div class="page-header"></div>
            <div class="status-banner" id="sms-banner"></div>

            <div class="page-content">
                <div class="page-title">发送短信</div>
                <div class="sms-send-form">
                    <div class="sms-field">
                        <label class="sms-label" for="sms-number">接收号码</label>
                        <input class="sms-input" id="sms-number" type="tel" maxlength="21"
                               placeholder="可含 +，3~20 位数字" autocomplete="off">
                    </div>
                    <div class="sms-field">
                        <label class="sms-label" for="sms-text">短信内容</label>
                        <textarea class="sms-text" id="sms-text" maxlength="160" rows="4"
                                  placeholder="ASCII 最多 160 字符，中文最多 70 字"></textarea>
                    </div>
                    <div class="sms-form-foot">
                        <span class="sms-count" id="sms-count">0 / 160</span>
                        <button class="save-btn sms-send-btn" type="button" id="sms-send-btn">发送短信</button>
                    </div>
                </div>

                <div class="page-title">短信记录</div>
                <div class="sms-storage" id="sms-storage"></div>
                <div class="sms-scroll">
                    <table class="sms-table">
                        <thead>
                        <tr>
                            <th class="sms-from">号码</th>
                            <th class="sms-body">内容</th>
                            <th class="sms-time">时间</th>
                            <th class="sms-op">操作</th>
                        </tr>
                        </thead>
                        <tbody id="sms-tbody"></tbody>
                    </table>
                </div>
                <div class="sms-empty" id="sms-empty"></div>

                <div class="page-title">短信转发（MQTT）</div>
                <div class="page-detail">
                    <div class="sms-mqtt-state" id="mqtt-state"></div>
                    <div class="sms-mqtt-note" id="mqtt-note"></div>

                    <div class="line-base flex flex-ac">
                        <span class="title">启用转发:</span>
                        <div class="check-line">
                            <input class="content-two" type="checkbox" id="mqtt-enabled">
                            <span class="content-thr">4G 在线时把收到的短信推送到 MQTT 服务器（仅 TLS）。</span>
                        </div>
                    </div>
                    <div class="line-base flex flex-ac">
                        <span class="title">允许远程发送:</span>
                        <div class="check-line">
                            <input class="content-two" type="checkbox" id="mqtt-allow-send">
                            <span class="content-thr">勾选后执行下行主题中的发送命令，目标号码不受限制。</span>
                        </div>
                    </div>
                    <div class="line-base">
                        <label class="title" for="mqtt-host">服务器地址:</label>
                        <input class="content" id="mqtt-host" maxlength="64"
                               placeholder="mqtt.example.com 或 IPv4" autocomplete="off">
                    </div>
                    <div class="line-base">
                        <label class="title" for="mqtt-port">端口:</label>
                        <input class="content" id="mqtt-port" type="number" min="1" max="65535"
                               value="8883" autocomplete="off">
                    </div>
                    <div class="line-base">
                        <label class="title" for="mqtt-user">用户名:</label>
                        <input class="content" id="mqtt-user" maxlength="64"
                               placeholder="留空表示匿名登录" autocomplete="off">
                    </div>
                    <div class="line-base">
                        <label class="title" for="mqtt-pass">密码:</label>
                        <input class="content" id="mqtt-pass" type="password" maxlength="128"
                               placeholder="留空表示不修改" autocomplete="new-password">
                    </div>
                    <div class="line-base">
                        <label class="title" for="mqtt-topic-up">上行主题:</label>
                        <input class="content" id="mqtt-topic-up" maxlength="128"
                               placeholder="例如 cpe/sms/up" autocomplete="off">
                    </div>
                    <div class="line-base">
                        <label class="title" for="mqtt-topic-down">下行主题:</label>
                        <input class="content" id="mqtt-topic-down" maxlength="128"
                               placeholder="例如 cpe/sms/down" autocomplete="off">
                    </div>
                    <div class="line-base">
                        <label class="title" for="mqtt-ca-file">CA 证书:</label>
                        <input class="content sms-mqtt-ca-file" id="mqtt-ca-file" type="file"
                               accept=".pem,.crt,.cer,text/plain">
                    </div>
                    <div class="line-base">
                        <span class="title">证书来源:</span>
                        <span class="sms-mqtt-ca-state" id="mqtt-ca-state"></span>
                    </div>
                    <div class="line-base-btn sms-mqtt-ca-actions">
                        <button class="save-btn" type="button" id="mqtt-ca-upload">上传 CA 证书</button>
                        <button class="save-btn" type="button" id="mqtt-ca-clear">清除 CA 证书</button>
                    </div>
                    <div class="line-base-btn">
                        <button class="save-btn" type="button" id="mqtt-save">保存转发设置</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/layout.js"></script>
<script src="js/api.js"></script>
<script src="js/sms.js"></script>
<script src="js/sms_mqtt.js"></script>
</body>
</html>
